server {
  listen 80;
  root /usr/share/nginx/html;

  # Security headers for the app shell. Artifacts render in a sandboxed srcdoc iframe
  # (opaque origin) and carry their own stricter CSP.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src 'self' about: data:; connect-src 'self'; object-src 'none'; base-uri 'none'" always;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;            # SSE streaming
    proxy_read_timeout 300s;
  }
  location /health {
    proxy_pass http://api:8000;
  }
  location / {
    try_files $uri /index.html;
  }
}
